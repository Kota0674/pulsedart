# ---- core ----
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_REBOOT=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# ---- peripherals ----
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_WATCHDOG=y

# ---- persistent settings (own partition @0xF0000) ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- USB HID (wired) ----
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# ---- Bluetooth LE HID ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Pulsedart"
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_PRIVACY=n
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REP_MAX=3
CONFIG_BT_HIDS_OUTPUT_REP_MAX=0
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Pulsedart project"
CONFIG_BT_CONN_CTX=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# ble.c requests the parameters itself on connect; no second automatic request
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# ---- ESB to the stock dongle, sharing the radio with BLE through MPSL timeslots ----
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=68
CONFIG_ESB_MPSL_TIMESLOT=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y

# Dongle pairing record. Empty = use the record the stock firmware left at 0xEF000, i.e.
# the dongle this mouse was sold/paired with. To use another dongle without pairing, put
# its record in mouse/local.conf (not in git), e.g.
#   CONFIG_PULSEDART_ESB_RECORD="02 02 4a 91 3c d7 01 ff"
CONFIG_PULSEDART_ESB_RECORD=""

# A host that "forgets" the mouse must be able to pair again without a button combo:
# allow a new Just Works pairing to replace the stored keys of the same peer.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# 3 HIDS input reports (mouse, keyboard, consumer) need more GATT attributes
CONFIG_BT_HIDS_ATTR_MAX=40

# A fatal error (e.g. an MPSL assert) reboots instead of leaving the radio dead
CONFIG_RESET_ON_FATAL_ERROR=y
