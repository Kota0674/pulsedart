# ---- firmware update over USB: DFU run-time + DFU mode into slot 1, MCUboot installs ----
CONFIG_USBD_DFU=y
CONFIG_USBD_DFU_FLASH=y
CONFIG_USBD_DFU_FLASH_SLOT0=n
CONFIG_USBD_DFU_FLASH_SLOT1=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# image version checked by MCUboot/dfu tools; bump for every release
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.4.1+0"
