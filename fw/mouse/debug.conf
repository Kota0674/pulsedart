# Debug build (fw\build-mcuboot.ps1 -Debug): the log also goes to a USB virtual COM port
# (CDC ACM, works without drivers on Windows/Linux/macOS). Not for daily use: it adds
# two USB interfaces next to the stock HID set.
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
# LOG_BACKEND_UART depends on the UART console (the normal build uses the RTT console)
CONFIG_UART_CONSOLE=y
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=y
# a bigger buffer so the boot messages survive until a terminal opens the port
CONFIG_LOG_BUFFER_SIZE=4096
