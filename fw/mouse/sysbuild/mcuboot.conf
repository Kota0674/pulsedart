# MCUboot for the Pulsedart board: no UART (not wired), log over RTT
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y

# ---- recovery: USB DFU inside MCUboot, entered with L+R+Back held at boot (fw/mcuboot_hooks) ----
CONFIG_BOOT_USB_DFU_GPIO=y
CONFIG_BOOT_USB_DFU_DETECT_DELAY=0
CONFIG_MCUBOOT_ACTION_HOOKS=y
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0102
CONFIG_USB_DEVICE_PRODUCT="Pulsedart recovery"
CONFIG_USB_DEVICE_MANUFACTURER="Pulsedart"
