# OpenOCD config: Raspberry Pi 4 -> nRF52810 in the HyperX dongle (3.3 V logic)
# FOUND 2026-09-27 (all 6 CLK/DIO combinations tried): SWCLK = TP1 on GPIO27 (pin 13),
# SWDIO = TP3 on GPIO17 (pin 11). TP2 (GPIO22) is not SWD. Photo: docs/img/dongle_pads.jpg
# Wired in parallel with the mouse, on the LEFT header row (mouse stays on pins 18/20/22):
# First plan, kept for reference:
#   GPIO22 (pin 15) --[1k]-- TP2  (SWCLK, measured 0 V = internal pull-down)
#   GPIO27 (pin 13) --[1k]-- TP1  (SWDIO candidate A, measured 3.1 V)   -> dongle.cfg
#   GPIO17 (pin 11) --[1k]-- TP3  (SWDIO candidate B, measured 3.1 V)   -> dongle_tp3.cfg
#   pin 1 (3V3) -> V33, pin 9 (GND) -> GND
# SWDIO is open-drain: the Pi never drives it high, whatever is on the wire.

adapter driver linuxgpiod
adapter gpio swclk 27 -chip 0
adapter gpio swdio 17 -chip 0 -open-drain -pull-none

transport select swd
adapter speed 100
reset_config none

# own ports, so the dongle and the mouse can be open at the same time
gdb port 3334
telnet port 4445
tcl port 6667

source [find target/nordic/nrf52.cfg]

# refuse to run against the 2.1 V mouse
source dongle_guard.tcl
