# OpenOCD config: Raspberry Pi 4 (linuxgpiod) -> nRF52840 in HyperX Pulsefire Dart
# Wiring (BCM numbering):
#   GPIO25 (phys pin 22) -> CLK  (SWDCLK)
#   GPIO24 (phys pin 18) -> DIO  (SWDIO)
#   phys pin 20          -> GND
# Pi 4 exposes the 40-pin header on gpiochip0 (on Pi 5 it would be gpiochip4).
# Requires OpenOCD >= 0.12 (Raspberry Pi OS Bookworm ships 0.12).

adapter driver linuxgpiod
adapter gpio swclk 25 -chip 0
adapter gpio swdio 24 -chip 0

transport select swd

# Bit-banged SWD: keep it slow on flying wires, raise later if stable.
adapter speed 500

# No reset line wired - use SWD soft reset only.
reset_config none

source [find target/nordic/nrf52.cfg]
