# Variant WITHOUT a level shifter (target VDD = 2.1 V).
# Wiring:
#   GPIO25 (pin 22) --[1k]--+-- CLK        divider 1k / 2k -> ~2.2 V
#                           [1k]
#                           [1k]           (2k = two 1k in series)
#                           GND
#   GPIO24 (pin 18) --[150R]---- DIO       open-drain: Pi only pulls low,
#                                          high comes from nRF's internal pull-up
#   pin 20 --------------------- GND
# Keep speed low: the open-drain rising edge is slow.

adapter driver linuxgpiod
adapter gpio swclk 25 -chip 0
adapter gpio swdio 24 -chip 0 -open-drain -pull-none

transport select swd
adapter speed 100
reset_config none

source [find target/nordic/nrf52.cfg]
